<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モジサク - タスク作業画面</title>
  <style>
    :root {
      --primary: #10b981;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px 16px 100px; }
    .container { max-width: 500px; margin: 0 auto; }
    
    .editor-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid var(--border);
      margin-top: 20px;
    }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    textarea { width: 100%; height: 90px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
    
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--border); padding: 12px 16px; }
    .btn-submit { width: 100%; max-width: 500px; margin: 0 auto; display: block; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <h2 style="font-size:18px;">✍️ ワーカー作業画面</h2>
    <p style="font-size:12px; color:#64748b; margin-top:4px;">AIが作った下書きを自由に変更してください。</p>

    <div class="editor-card">
      <label>1. X（旧Twitter）用 ポスト文</label>
      <textarea id="out-x"></textarea>

      <label>2. Note / Instagram用 要約文</label>
      <textarea id="out-note"></textarea>

      <label>3. テロップテキスト</label>
      <textarea id="out-telop"></textarea>
    </div>
  </div>

  <div class="bottom-bar">
    <button type="button" class="btn-submit" onclick="goNext()">チェックを完了して提出する ➔</button>
  </div>

  <script>
    // 画面が開いたらデータを入れる
    window.onload = function() {
      const savedData = localStorage.getItem('mojisaku_data');
      if (savedData) {
        const data = JSON.parse(savedData);
        document.getElementById('out-x').value = data.x_post || '';
        document.getElementById('out-note').value = data.note_summary || '';
        document.getElementById('out-telop').value = data.telop_text || '';
      }
    };

    // ボタンを押したら即座に画面3へ飛ぶ
    function goNext() {
      const finalData = {
        x_post: document.getElementById('out-x').value,
        note_summary: document.getElementById('out-note').value,
        telop_text: document.getElementById('out-telop').value
      };
      localStorage.setItem('mojisaku_final_data', JSON.stringify(finalData));
      // ポップアップを挟まず、直接画面3へ移動
      window.location.href = 'success.html';
    }
  </script>

</body>
</html>
